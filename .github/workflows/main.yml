name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    defaults:
      run:
        working-directory: arabe-player
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npx expo install expo-audio expo-sqlite react-native-webview -- --legacy-peer-deps
          npx expo install --fix -- --legacy-peer-deps

      - name: Revisar tipos (informativo)
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | head -40

      - name: Revisar paquete JS (muestra el error real en pocos segundos)
        run: |
          set -o pipefail
          npx expo export --platform android --output-dir /tmp/export-check 2>&1 | tail -60

      - name: Generate native Android project
        run: npx expo prebuild -p android --no-install

      - name: Probar empaquetado como lo hace Gradle
        continue-on-error: true
        run: |
          npx expo export:embed --platform android --dev false --minify true --reset-cache \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output /tmp/index.android.bundle --assets-dest /tmp/res > /tmp/probe.log 2>&1
          echo "probe exit code: $?" >> /tmp/probe.log
          tail -80 /tmp/probe.log

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Mostrar el error real
        if: failure()
        run: |
          {
            echo "## Error real del empaquetado"
            echo "### Prueba aparte (final)"
            echo '```'
            tail -40 /tmp/probe.log | cut -c1-300
            echo '```'
            echo "### Gradle (antes de FAILURE)"
            echo '```'
            grep -v '^w: ' /tmp/gradle.log | grep -B45 'FAILURE: Build failed' | head -70 | cut -c1-300
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          MSG=$(tail -25 /tmp/probe.log | cut -c1-250 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Error real (prueba aparte)::$MSG"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arabe-player-apk
          path: arabe-player/android/app/build/outputs/apk/release/*.apk
